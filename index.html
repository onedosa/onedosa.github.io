<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Host</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="host-shell">
<section class="host-card" aria-live="polite">
<div class="brand-mark">PS</div>
<div class="eyebrow">Offline-ready exploit host</div>
<h1 class="title">PS4 Host</h1>
<p class="subtitle">Select start to prepare the matching firmware chain.</p>
<div class="status-wrap">
<div class="status-row"><span id="dot" class="status-dot busy"></span><span id="status" class="status">Detecting firmware</span></div>
<div id="fw" class="firmware hidden"></div>
<div id="hint" class="hint">Please wait…</div>
<button id="start" class="action hidden" type="button">Start Jailbreak</button>
</div>
<div class="footer">PS4 exploit host • offline cache supported</div>
</section>
</main>
<script>
(() => {
  const status=document.getElementById('status');
  const fwEl=document.getElementById('fw');
  const hint=document.getElementById('hint');
  const dot=document.getElementById('dot');
  const start=document.getElementById('start');

  const m=(navigator.userAgent||'').match(/PlayStation 4[ \/]([\d.]+)/i);
  const fw=m?parseFloat(m[1]):NaN;

  const supported=n=>
    (n===5.05||n===5.07) ||
    (n>=7&&n<=8.52) ||
    (n>=9&&n<=9.60) ||
    (n>=10&&n<=11.02) ||
    (n>=11.50&&n<=13.52);

  const cachePage=n=>
    (n===5.05||n===5.07) ? 'core/cache505.html' :
    (n>=7&&n<=8.52) ? 'core/cache700.html' :
    (n>=9&&n<=9.60) ? 'core/cache900.html' :
    (n>=10&&n<=11.02) ? 'core/cachecss.html' :
    (n>=11.50&&n<=13.52) ? 'core/cacheslopkit.html' : null;

  if(!m||Number.isNaN(fw)){
    dot.classList.remove('busy');
    dot.style.background='var(--danger)';
    status.textContent='Firmware not detected';
    status.className='status error';
    hint.textContent='Open this page in the PS4 system browser.';
    return;
  }

  fwEl.textContent='Firmware '+m[1];
  fwEl.classList.remove('hidden');

  if(!supported(fw)){
    dot.classList.remove('busy');
    dot.style.background='var(--danger)';
    status.textContent='Firmware not supported';
    status.className='status error';
    hint.textContent='Detected firmware '+m[1];
    return;
  }

  dot.classList.remove('busy');
  status.textContent='Firmware supported';
  hint.textContent='Ready to start';
  start.classList.remove('hidden');

  let started=false;
  function begin(){
    if(started)return;
    started=true;
    start.disabled=true;
    start.classList.add('hidden');
    status.textContent='Preparing offline cache';
    hint.textContent='Installing firmware chain…';

    const page=cachePage(fw);
    if(page){
      window.location.replace(page);
    }else{
      status.textContent='Exploit unavailable';
      status.className='status error';
    }
  }

  // Only the visible UI button starts the process.
  // No keyboard/gamepad/any-button handlers.
  start.addEventListener('click',begin,false);
})();
</script>
</body>
</html>
