<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 HEN</title>
<style>
:root {
  --bg:#020806;
  --text:#f2f8f4;
  --muted:#91a79b;
  --dim:#60756a;
  --green:#43f59a;
  --green-soft:rgba(67,245,154,.17);
  --danger:#ff9b9b;
}
* { box-sizing:border-box; }
html,body {
  width:100%; height:100%; margin:0; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
body { display:flex; align-items:center; justify-content:center; }
#app { width:100%; max-width:720px; padding:32px 28px; text-align:center; }
#mark {
  width:min(180px,40vw); height:min(180px,40vw);
  object-fit:contain; display:block; margin:0 auto 28px;
}
#spinner {
  width:42px; height:42px; margin:0 auto 22px;
  border:4px solid var(--green-soft);
  border-top-color:var(--green);
  border-radius:50%;
  animation:rotate .8s linear infinite;
}
@keyframes rotate { to { transform:rotate(360deg); } }
#status { min-height:26px; font-size:18px; letter-spacing:.1px; }
#firmware { min-height:20px; margin-top:8px; color:var(--muted); font-size:13px; }
#cache { min-height:18px; margin-top:7px; color:var(--dim); font-size:12px; }
#start {
  display:none; align-items:center; justify-content:center;
  min-width:190px; height:46px; margin:24px auto 0;
  padding:0 25px; border-radius:999px;
  border:1px solid rgba(67,245,154,.42);
  background:rgba(67,245,154,.08);
  color:var(--text); font-size:15px; font-weight:600;
  cursor:pointer;
}
#start:active { transform:scale(.98); }
.ready #spinner { display:none; }
.ready #start { display:inline-flex; }
.ok { color:#72f2a8; }
.warn { color:#dceee4; }
.error { color:var(--danger); }
</style>
</head>
<body>
<main id="app">
  <img id="mark" src="img.jpg" alt="PlayStation">
  <div id="spinner"></div>
  <div id="status">Reading firmware...</div>
  <div id="firmware"></div>
  <div id="cache"></div>
  <button id="start" type="button">Start Jailbreak</button>
</main>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var status = document.getElementById("status");
  var firmware = document.getElementById("firmware");
  var cache = document.getElementById("cache");
  var start = document.getElementById("start");

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = cls || "";
  }

  function setCache(text, cls) {
    cache.textContent = text;
    cache.className = cls || "";
  }

  /*
   * Firmware detection is kept in the UI layer only.
   * The exploit files, patches and folder structure are untouched.
   */
  var ua = navigator.userAgent || "";
  var match = /PlayStation\s*4[\/ ](\d+)\.(\d+)/i.exec(ua);
  var fw = null;
  var fwNum = 0;

  if (match) {
    var major = parseInt(match[1], 10);
    var minor = match[2];
    fw = major + "." + minor;
    fwNum = major * 100 + parseInt(minor, 10);
  }

  firmware.textContent = "Firmware: " + (fw || "Unknown");

  var supported = {
    1302:true,
    1304:true,
    1350:true,
    1352:true
  }[fwNum] === true;

  var started = false;

  function startJailbreak() {
    if (started) return;
    started = true;
    start.disabled = true;
    setStatus("Starting jailbreak...", "warn");
    window.location.replace('core/index.html');
  }

  /*
   * Only the visible UI button starts the manual flow.
   * There is intentionally NO keydown/keyup/gamepad/"any button" handler.
   */
  start.addEventListener("click", startJailbreak, false);

  if (!supported) {
    app.className = "ready";
    start.textContent = "Continue";
    setStatus("Firmware not supported", "error");
    setCache("Supported: 13.02 / 13.04 / 13.50 / 13.52");
    return;
  }

  setStatus("Firmware " + fw + " supported", "ok");

  var ac = window.applicationCache;

  /*
   * Offline reopen:
   * If the page is already being served from Application Cache, proceed
   * directly to the existing JB entry point. No user interaction is needed.
   */
  if (ac && ac.status === ac.IDLE && !navigator.onLine) {
    setCache("Offline cache active", "ok");
    setTimeout(startJailbreak, 80);
    return;
  }

  if (!ac) {
    app.className = "ready";
    setCache("Offline cache unavailable", "error");
    return;
  }

  if (ac.status === ac.UPDATEREADY) {
    try { ac.swapCache(); } catch (e) {}
    setCache("Offline cache updated", "ok");
    setTimeout(startJailbreak, 120);
    return;
  }

  if (ac.status === ac.IDLE) {
    setCache("Offline cache ready", "ok");
    app.className = "ready";
    return;
  }

  setCache("Preparing offline cache...");

  ac.addEventListener("downloading", function () {
    setCache("Caching for offline use...");
  }, false);

  ac.addEventListener("progress", function (e) {
    if (e && e.total) {
      setCache("Caching " + Math.round((e.loaded / e.total) * 100) + "%");
    }
  }, false);

  // First successful cache: automatically continue to JB.
  ac.addEventListener("cached", function () {
    setCache("Offline cache ready", "ok");
    setTimeout(startJailbreak, 120);
  }, false);

  ac.addEventListener("noupdate", function () {
    setCache("Offline cache ready", "ok");
    app.className = "ready";
  }, false);

  ac.addEventListener("updateready", function () {
    try { ac.swapCache(); } catch (e) {}
    setCache("Offline cache updated", "ok");
    setTimeout(startJailbreak, 120);
  }, false);

  ac.addEventListener("error", function () {
    setCache("Offline cache failed", "error");
    app.className = "ready";
  }, false);
})();
</script>
</body>
</html>
